# Included only by the exact desktop-connection API locations.
# These endpoints use their own bearer sessions and intentionally bypass the
# shared browser Basic Auth. No other /smartstock route includes this file.
auth_basic off;
client_max_body_size 64k;
proxy_http_version 1.1;

proxy_pass http://127.0.0.1:3000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix /smartstock;

proxy_buffering off;
proxy_cache off;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
